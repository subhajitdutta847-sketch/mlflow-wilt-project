name: Retrain and Promote Model

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0'  # weekly, every Sunday midnight UTC

jobs:
  retrain:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install mlflow scikit-learn pandas xgboost

      - name: Run retrain script
        env:
          MLFLOW_ALLOW_FILE_STORE: "true"
        run: python retrain.py

      - name: Commit updated model registry
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add mlruns/
          git diff --staged --quiet || git commit -m "Auto-retrain: promote improved model"
          git push