name: Retrain and Promote Model

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0'  # weekly, every Sunday midnight UTC

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install mlflow scikit-learn pandas xgboost

      - name: Run retrain script
        run: python retrain.py